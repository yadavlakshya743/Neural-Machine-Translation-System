# ==============================================================================
# Baseline Experiment Configuration: Custom Transformer English <-> Hindi
# Grounded in "Attention Is All You Need" (Vaswani et al., NeurIPS 2017)
# ==============================================================================

model:
  name: "transformer_en_hi_baseline"
  src_vocab_size: 16000
  tgt_vocab_size: 16000
  d_model: 256            # 256 for rapid baseline, 512 for standard
  n_heads: 8
  n_encoder_layers: 4     # 4 for baseline, 6 for standard
  n_decoder_layers: 4     # 4 for baseline, 6 for standard
  d_ff: 1024              # 1024 for baseline, 2048 for standard
  dropout: 0.1
  max_seq_len: 128
  share_embeddings: false

data:
  corpus: "iitb_parallel"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  src_lang: "en"
  tgt_lang: "hi"
  max_src_len: 128
  max_tgt_len: 128
  batch_size: 64
  num_workers: 4

training:
  epochs: 20
  learning_rate: 0.0005
  warmup_steps: 4000
  label_smoothing: 0.1
  grad_clip: 1.0
  weight_decay: 0.0001
  save_every_epoch: 2
  checkpoint_dir: "models"
  log_interval: 100

decoding:
  strategy: "beam_search"
  beam_size: 4
  alpha: 0.6               # Length penalty
  max_len: 128
