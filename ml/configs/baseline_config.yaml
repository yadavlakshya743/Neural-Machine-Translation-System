# ==============================================================================
# Baseline: small Transformer (fits a 6 GB laptop GPU; also the "baseline" in the
# baseline -> final comparison required by the PRD).
# Grounded in "Attention Is All You Need" (Vaswani et al., NeurIPS 2017)
#
#   python scripts/train.py --config ml/configs/baseline_config.yaml --direction en-hi
# ==============================================================================

model:
  name: "transformer_small"
  d_model: 256
  n_heads: 4
  n_encoder_layers: 4
  n_decoder_layers: 4
  d_ff: 1024
  dropout: 0.1
  tie_embeddings: true      # share target embedding with the output projection

data:
  direction: "en-hi"        # or "hi-en"; overridable with --direction
  processed_dir: "data/processed"
  tokenizer_dir: "ml/tokenization"
  max_len: 128              # max subword tokens per sentence, incl. <sos>/<eos>
  max_tokens: 4000          # tokens per micro-batch (incl. padding); safe on a 6 GB laptop GPU
  max_train_samples: 0      # 0 = full cleaned training set
  num_workers: 0

training:
  seed: 42
  epochs: 10
  learning_rate: 0.001      # peak LR after warmup, then inverse-sqrt decay
  warmup_steps: 4000
  label_smoothing: 0.1
  grad_clip: 1.0
  weight_decay: 0.0001
  accum_steps: 3            # ~12k tokens per optimizer step
  use_amp: true
  patience: 3
  select_metric: "bleu"     # best.pt chosen by dev BLEU (official dev split, never test)
  save_every_steps: 1000
  log_interval: 100
  checkpoint_dir: "models"

decoding:
  strategy: "beam_search"
  beam_size: 4
  alpha: 0.6
  max_len: 128
