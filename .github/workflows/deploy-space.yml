name: Deploy to Hugging Face Space

# Every push to main updates the live app. Needs two settings in the GitHub repo
# (Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  = a Hugging Face *write* token
#   variable HF_SPACE  = <hf-username>/nmt-translator
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.24"
      - name: Upload code to the Space (it rebuilds automatically)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/setup_space.py --code-only --space "${{ vars.HF_SPACE }}" --message "Deploy ${{ github.sha }}"
